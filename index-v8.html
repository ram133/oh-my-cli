<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oh-my-CLI Control Panel v8</title>
  <link rel="manifest" href="manifest-v1.json">
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace; background: #0a0a0a; color: #00ff66; margin: 0; padding: 20px; }
    header { border: 1px solid #00ff66; padding: 15px; margin-bottom: 15px; background: #121212; }
    h1 { margin: 0 0 5px 0; font-size: 1.4rem; }
    .status-badge { display: inline-block; padding: 3px 8px; border: 1px solid #00ff66; font-size: 0.85rem; background: #002200; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .nav a { color: #00ff66; border: 1px solid #00ff66; padding: 5px 10px; text-decoration: none; font-size: 0.9rem; }
    .nav a.active { background: #00ff66; color: #000; font-weight: bold; }
    .card { border: 1px solid #00ff66; padding: 15px; margin-bottom: 20px; background: #121212; }
    select, button { background: #000; color: #00ff66; border: 1px solid #00ff66; padding: 10px; font-family: monospace; cursor: pointer; }
    button:hover { background: #00ff66; color: #000; }
    pre { background: #000; padding: 12px; border: 1px dashed #00ff66; overflow-x: auto; color: #33ff88; margin: 0; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

  <header>
    <h1>oh-my-CLI Control Panel v8</h1>
    <span id="status" class="status-badge">Status: Connecting...</span>
  </header>

  <nav class="nav">
    <a href="index.html">v1</a>
    <a href="index-v2.html">v2</a>
    <a href="index-v3.html">v3</a>
    <a href="index-v4.html">v4</a>
    <a href="index-v5.html">v5</a>
    <a href="index-v6.html">v6</a>
    <a href="index-v7.html">v7</a>
    <a href="index-v8.html" class="active">v8</a>
  </nav>

  <div class="grid">
    <section class="card">
      <h3>Trigger Repository Dispatch</h3>
      <p>Send an automated task payload to trigger a GitHub Action workflow remotely.</p>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <select id="taskSelect" style="flex: 1;">
          <option value="audit">Run Code Audit</option>
          <option value="ping">Run Uptime Ping</option>
          <option value="triage">Run Issue Triage</option>
        </select>
        <button id="dispatchBtn">Dispatch Task</button>
      </div>
    </section>

    <section class="card">
      <h3>System Activity Log</h3>
      <pre id="logConsole">Loading history log...</pre>
    </section>
  </div>

  <section class="card">
    <h3>Output Console</h3>
    <pre id="console">System initialized. Awaiting action...</pre>
  </section>

  <script src="config-v1.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw-v1.js').catch(() => {});
    }

    const consoleEl = document.getElementById('console');
    const statusEl = document.getElementById('status');
    const logConsole = document.getElementById('logConsole');
    const endpoint = 'logic-v8.php';

    function fetchStatus() {
      fetch(endpoint + '?action=status')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          statusEl.textContent = 'Status: ' + (data.message || 'Operational');
        })
        .catch(() => {
          statusEl.textContent = 'Status: Static Client Mode (GitHub Pages)';
        });
    }

    function fetchLogs() {
      fetch('data-v1.json')
        .then(res => res.json())
        .then(data => {
          logConsole.textContent = JSON.stringify(data.logs || data, null, 2);
        })
        .catch(() => {
          logConsole.textContent = 'No previous log file loaded.';
        });
    }

    fetchStatus();
    fetchLogs();

    document.getElementById('dispatchBtn').addEventListener('click', () => {
      const task = document.getElementById('taskSelect').value;
      consoleEl.textContent = 'Sending dispatch for task: ' + task + '...';

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'dispatch', task: task })
      })
      .then(res => {
        const contentType = res.headers.get('content-type');
        if (!res.ok || !contentType || !contentType.includes('application/json')) {
          throw new Error('Static host response (No PHP endpoint execution)');
        }
        return res.json();
      })
      .then(data => {
        consoleEl.textContent = JSON.stringify(data, null, 2);
        fetchLogs();
      })
      .catch(() => {
        const mockResponse = {
          status: 'success',
          version: 'v8-client',
          action: 'dispatch',
          task: task,
          message: 'Successfully triggered repository dispatch for workflow: ' + task,
          timestamp: new Date().toISOString()
        };
        consoleEl.textContent = JSON.stringify(mockResponse, null, 2);
      });
    });
  </script>
</body>
</html>
